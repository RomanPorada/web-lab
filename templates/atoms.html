<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Атоми</title>
    <script>
        let atomsData = [];

        async function loadAtoms() {
            let res = await fetch("/get_atoms");
            atomsData = await res.json();
            renderAtoms();
        }

        function renderAtoms() {
            let list = document.getElementById("atomsList");
            list.innerHTML = "";
            let search = document.getElementById("searchAtom").value.toLowerCase();
            let sortBy = document.getElementById("sortAtom").value;

            let filtered = atomsData.filter(atom =>
                atom.name.toLowerCase().includes(search) ||
                atom.symbol.toLowerCase().includes(search)
            );

            filtered.sort((a, b) => {
                if (sortBy === "name") return a.name.localeCompare(b.name);
                if (sortBy === "symbol") return a.symbol.localeCompare(b.symbol);
                if (sortBy === "mass") return a.mass - b.mass;
                return 0;
            });

            filtered.forEach(atom => {
                let li = document.createElement("li");
                li.textContent = `${atom.name} (${atom.symbol}) | Маса: ${atom.mass} | p:${atom.protons}, n:${atom.neutrons}, e:${atom.electrons} | ${atom.state}`;
                let delBtn = document.createElement("button");
                delBtn.textContent = "❌";
                delBtn.onclick = async () => {
                    await fetch(`/delete_atom/${atom.id}`, {method: "DELETE"});
                    loadAtoms();
                };
                li.appendChild(delBtn);
                list.appendChild(li);
            });

            // підрахунок сумарної маси
            let total = filtered.reduce((sum, atom) => sum + atom.mass, 0);
            document.getElementById("totalMass").textContent = total.toFixed(2);
        }

        async function addAtom() {
            let atom = {
                name: document.getElementById("name").value,
                symbol: document.getElementById("symbol").value,
                mass: parseFloat(document.getElementById("mass").value),
                protons: parseInt(document.getElementById("protons").value),
                neutrons: parseInt(document.getElementById("neutrons").value),
                electrons: parseInt(document.getElementById("electrons").value),
                state: document.getElementById("state").value
            };
            await fetch("/add_atom", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(atom)
            });
            loadAtoms();
        }

        window.onload = loadAtoms;
    </script>
</head>
<body>
    <h1>Створення атома</h1>
    <input id="name" placeholder="Назва">
    <input id="symbol" placeholder="Символ (H, O...)">
    <input id="mass" placeholder="Маса" type="number" step="0.01">
    <input id="protons" placeholder="Протони" type="number">
    <input id="neutrons" placeholder="Нейтрони" type="number">
    <input id="electrons" placeholder="Електрони" type="number">
    <select id="state">
        <option>Stable</option>
        <option>Unstable</option>
    </select>
    <button onclick="addAtom()">Додати атом</button>

    <h2>Список атомів</h2>
    <input id="searchAtom" placeholder="Пошук..." oninput="renderAtoms()">
    <select id="sortAtom" onchange="renderAtoms()">
        <option value="name">Сортувати за назвою</option>
        <option value="symbol">Сортувати за символом</option>
        <option value="mass">Сортувати за масою</option>
    </select>

    <ul id="atomsList"></ul>
    <p><b>Загальна маса:</b> <span id="totalMass">0</span></p>

    <p><a href="/">⬅ Назад</a></p>
</body>
</html>
